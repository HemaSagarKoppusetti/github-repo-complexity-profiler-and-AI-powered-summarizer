services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: profiler-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/profiler.db
      - FRONTEND_ORIGIN=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - MAX_REPO_SIZE_MB=300
      - CLONE_TIMEOUT_SECONDS=180
      - MAX_PYTHON_FILES=2000
      - MAX_CONCURRENT_JOBS=2
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: profiler-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
